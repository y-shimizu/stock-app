<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}株価分析管理画面{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="logo">📈</span>
            <span>Stock Admin</span>
        </div>
        <nav>
            <a href="{{ url_for('dashboard') }}" class="{% if request.endpoint == 'dashboard' %}active{% endif %}">ダッシュボード</a>
            <a href="{{ url_for('stocks') }}" class="{% if request.endpoint in ['stocks', 'stock_detail'] %}active{% endif %}">銘柄一覧</a>
        </nav>
        <div class="user">y.shimizu</div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <small>© 2026 Stock Admin (ダミーデータ)</small>
    </footer>
</body>
</html>
